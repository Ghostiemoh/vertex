name: Vertex CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Vertex/package-lock.json

      - name: Install
        working-directory: Vertex
        run: npm ci

      - name: Lint
        working-directory: Vertex
        run: npm run lint

      - name: Test
        working-directory: Vertex
        run: npm run test

      - name: Build
        working-directory: Vertex
        run: npm run build
